name: AI Code Governance with SonarCloud

on:
  workflow_dispatch: # 支持网页上手动点按钮触发
  push:
    branches:
      - hook         # 当前测试分支
      - main         # 如果后续切回 main 也会触发
    paths:
      - 'src/**'       # 只有 src 目录下的代码变动才触发
      - 'pom.xml'      # 或 build.gradle
      - '.github/**'   # 包含 .github 变动触发
      - '.semgrep.yml' # Semgrep 安全与规约配置变动

# 显式声明所需权限
permissions:
  contents: write        # git push 新分支
  pull-requests: write   # 创建 PR
  issues: write          # 创建 Issue / 评论

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  # ── Step 1：优先执行 Semgrep SAST 代码安全与阿里规约扫描 ────────
  security-check:
    name: Security & Code Standards Scan (Semgrep)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]') &&
       !contains(github.event.head_commit.message, 'ai-fix-') &&
       !startsWith(github.event.head_commit.message, 'fix: AI 根据 Issue') &&
       !startsWith(github.event.head_commit.message, 'fix: AI 自动批量修复'))
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Semgrep SAST & Standards Scan
        id: semgrep_scan
        run: |
          semgrep scan src/ \
            --config .semgrep.yml \
            --config "p/owasp-top-ten" \
            --config "p/cwe-top-25" \
            --config "p/java" \
            --json-output=semgrep.json \
            --error

      # 当 Semgrep 扫描拦截报错挂掉时，向飞书群推送告警卡片
      - name: Send Feishu Alert on Security Failure
        if: failure() && steps.semgrep_scan.outcome == 'failure'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python3 .github/scripts/notify_feishu_semgrep.py

