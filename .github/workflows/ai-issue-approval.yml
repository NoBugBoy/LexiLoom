name: AI Issue Approval Handler

on:
  issue_comment:
    types: [ created ]

# 显式声明所需权限，默认 GITHUB_TOKEN 缺少这些会导致 git push / 创建 PR 静默失败
permissions:
  contents: write        # git push 新分支
  pull-requests: write   # 创建 PR
  issues: write          # 回复 Issue 评论

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  handle-approval:
    # 仅在非 Bot 评论，且包含 "同意" / "执行" / "approve" 等确认词时触发
    if: |
      !endsWith(github.event.comment.user.login, '[bot]') &&
      (contains(github.event.comment.body, '同意') || 
       contains(github.event.comment.body, '执行') || 
       contains(github.event.comment.body, 'approve'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java & Tools
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: "pip install --only-binary :all: requests==2.32.3 httpx==0.27.2 openai==1.55.0"

      - name: Apply Solution and Open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-v4-flash' }}
          TARGET_BRANCH: ${{ vars.TARGET_BRANCH || 'hook' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          python .github/scripts/apply_solution_from_issue.py