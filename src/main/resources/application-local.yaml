    activate:
      on-profile: local
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/lexiloom?currentSchema=public&reWriteBatchedInserts=true
    username: postgres
    password: root
  flyway:
    enabled: false
    baseline-on-migrate: true
  data:
    redis:
      url: redis://localhost:6379
  jpa:
    hibernate:
      # 量产阶段使用 flyway，关闭 ddl-auto 改为 validate
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  threads:
    virtual:
      enabled: true
  mail:
    host: smtp.qq.com
    port: 465
    username: 754369677@qq.com
    password: yjxfnjndtvpqbgad
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    socket-timeout: 30s
    connection-timeout: 5s

