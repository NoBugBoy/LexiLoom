  miniapp:
    appid: wx0c0e1b56a66e6e3b
    secret: 56fe21c4c920712af5eb991cb356695b

# ── 安全 ──────────────────────────────────────────────────────────────────────
security:
  token:
    expire-seconds: 7200

# ── 对象存储 (RustFS / S3 兼容) ───────────────────────────────────────────────
lexiloom:
  storage:
    rustfs:
      enabled: true
      endpoint: http://localhost:9000
      bucket-name: lexiloom
      access-key: rustfsadmin
      secret-key: rustfsadmin
      region: us-east-1

  # ── 文档解析引擎 ─────────────────────────────────────────────────────────────
  # 可选值: AUTO | DEEPDOC
  # AUTO: 根据文件类型自适应路由（默认使用当前 DeepDoc 引擎）
  parser:
    default-engine: AUTO
    # DeepDoc：对接部署在 Docker 中的 RAGFlow DeepDoc 服务
    deepdoc:
      endpoint: ${DEEPDOC_ENDPOINT:http://localhost:9390}
      callback-url: ${DEEPDOC_CALLBACK_URL:http://host.docker.internal:8080/api/documents/parse-callback}

  # ── Elasticsearch 全文检索 ───────────────────────────────────────────────────
  elasticsearch:
    index-name: lexiloom_doc_index
    auto-create-index: true

  # ── AI 智能问答与 RAG 检索增强中心 ──────────────────────────────────────────
  ai:
    enabled: true
    # 可选值: DEEPSEEK | QWEN
    model-provider: ${AI_MODEL_PROVIDER:QWEN}
    api-key: ${DASHSCOPE_API_KEY}
    base-url: ${AI_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
    chat-model: ${AI_CHAT_MODEL:qwen3.8-flash}
    reasoning-model: ${AI_REASONING_MODEL:qwen3.8-flash}
    chunk-index-name: ${AI_CHUNK_INDEX:lexiloom_chunk_index_v2}
    auto-create-index: true
    embedding:
      # 可选值: DASHSCOPE | OPENAI_COMPATIBLE
      provider: ${AI_EMBEDDING_PROVIDER:DASHSCOPE}
      api-key: ${AI_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}
      base-url: ${AI_EMBEDDING_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
      model: ${AI_EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
      dimension: 1024
    rerank:
      # 重排完全可选（默认关闭 NONE），开启时可选: NONE | RRF | CROSS_ENCODER
      enabled: true
      strategy: CROSS_ENCODER
      provider: DASHSCOPE
      api-key: ${AI_RERANK_API_KEY:${DASHSCOPE_API_KEY:}}
      base-url: ${AI_RERANK_BASE_URL:https://maas.qianwenaiapi.com/api/v1/services/rerank/text-rerank/text-rerank}
      model: ${AI_RERANK_MODEL:qwen3.7-text-rerank}
      top-k: 12
      min-score: 0.60
    chunk:
      context-prefix-enabled: true
      max-token-limit: 2000
    rag:
      top-k: 20
      vector-top-k: 18
      lexical-top-k: 2
      max-top-k: 50
      min-top-k: 20
      # 真实 Cosine 相似度阈值 (非重排模拟分)，0.30 对齐 1024 维中文向量模型分布
      similarity-threshold: 0.30
      # 单篇文档在同一批结果中的最大切片数，配合两阶段回填保证多文档多样性与单文档不漏切片 (<=0 关闭)
      max-chunks-per-document: 20
      history-turns: 5
      session-expire-seconds: 604800

