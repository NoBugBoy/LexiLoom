spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  threads:
    virtual:
      enabled: true
management:
  health:
    mail:
      enabled: false
minio:
  enabled: false
aliyun:
  oss:
    enabled: false
knowflow:
  elasticsearch:
    index-name: knowflow_doc_index_test
    auto-create-index: false
  parser:
    default-engine: AUTO
    deepdoc:
      endpoint: http://localhost:8001
  ai:
    enabled: true
    model-provider: MOCK
    chunk-index-name: knowflow_chunk_index_test
    auto-create-index: false
    embedding:
      provider: MOCK
      dimension: 1536
    rerank:
      enabled: false
      strategy: NONE
      provider: MOCK
    chunk:
      context-prefix-enabled: true
      max-token-limit: 2000
    rag:
      top-k: 5
      similarity-threshold: 0.60
      history-turns: 3
htz:
  security:
    public-key: ${publicKey:}
    private-key: ${privateKey:}
