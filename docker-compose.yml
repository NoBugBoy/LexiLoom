# LexiLoom 本地开发环境
# 包含：PostgreSQL 17 / Redis 7 / Elasticsearch 8 / RustFS (S3 兼容对象存储)
#
# 使用方式：
#   docker compose up -d          # 启动所有中间件
#   docker compose down           # 停止并保留数据卷
#   docker compose down -v        # 停止并清空所有数据
#   docker compose logs -f <svc>  # 跟踪某个服务日志

name: lexiloom-dev

services:

  # ─────────────────────────────────────────────
  # PostgreSQL 17
  # 连接串：jdbc:postgresql://localhost:5432/lexiloom?currentSchema=public
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: lexiloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexiloom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d lexiloom" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexiloom-net

  # ─────────────────────────────────────────────
  # Redis 7  (单机模式，开启持久化 AOF)
  # 连接：redis://localhost:6379
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lexiloom-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lexiloom-net

  # ─────────────────────────────────────────────
  # Elasticsearch 8.x  (单节点，关闭 SSL/xpack 安全)
  # HTTP: http://localhost:9200
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: lexiloom-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # 本地开发关闭 TLS/Basic Auth
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - ELASTIC_PASSWORD=changeme           # 若需要开启安全时生效
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    # 安装 IK 中文分词插件（版本须与 ES 镜像版本严格一致）
    # 首次启动耗时较长（需下载插件），后续因 es_data 卷持久化会跳过
    command:
      - bash
      - -c
      - |
        if [ ! -d /usr/share/elasticsearch/plugins/analysis-ik ]; then
          echo '>>> 安装 IK 中文分词插件 ...'
          /usr/share/elasticsearch/bin/elasticsearch-plugin install --batch \
            https://release.infinilabs.com/analysis-ik/stable/elasticsearch-analysis-ik-9.0.0.zip \
          || echo '!!! IK 插件安装失败，ES 将以未启用中文分词的方式继续启动'
        fi
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - lexiloom-net

  # ─────────────────────────────────────────────
  # Kibana 8.x  (可选，ES 可视化调试工具)
  # Web UI: http://localhost:5601
  # ─────────────────────────────────────────────
  #  kibana:
  #    image: docker.elastic.co/kibana/kibana:8.17.0
  #    container_name: lexiloom-kibana
  #    restart: unless-stopped
  #    depends_on:
  #      elasticsearch:
  #        condition: service_healthy
  #    environment:
  #      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #      - xpack.security.enabled=false
  #    ports:
  #      - "5601:5601"
  #    networks:
  #      - lexiloom-net
  #    profiles:
  #      - tools                               # docker compose --profile tools up -d 才启动

  # ─────────────────────────────────────────────
  # RustFS  (S3 兼容对象存储，MinIO 协议兼容)
  # API:      http://localhost:9000
  # Web UI:   http://localhost:9001
  # Bucket:   lexiloom  (首次启动后在 Web UI 手动创建，或见下方 mc-init)
  # ─────────────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: lexiloom-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - lexiloom-net
  deepdoc:
    container_name: deepdoc-server
    image: deepdoc-server:latest
    restart: unless-stopped
    ports:
      - "9390:9390"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 持久化挂载模型缓存目录，容器重启无需重新下载模型
      - ./model_cache:/root/.cache/deepdoc
      # 挂载修复后的解析服务入口脚本，无需重新构建镜像
      - ./.agents/deepdoc/server.py:/app/server.py
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9390/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 1536M


  # ─────────────────────────────────────────────
  # mc-init：自动创建 lexiloom Bucket（一次性 Job）
  # 依赖 rustfs 健康后运行，完成即退出
  # ─────────────────────────────────────────────
#  mc-init:
#    image: minio/mc:latest
#    container_name: lexiloom-mc-init
#    depends_on:
#      rustfs:
#        condition: service_healthy
#    entrypoint: >
#      /bin/sh -c "
#        mc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin &&
#        mc mb --ignore-existing rustfs/lexiloom &&
#        mc anonymous set public rustfs/lexiloom &&
#        echo '✅ Bucket lexiloom created'
#      "
#    networks:
#      - lexiloom-net
#    restart: "no"

# ─────────────────────────────────────────────
# 数据卷（持久化）
# ─────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  es_data:
  rustfs_data:

# ─────────────────────────────────────────────
# 内部网络
# ─────────────────────────────────────────────
networks:
  lexiloom-net:
    driver: bridge
